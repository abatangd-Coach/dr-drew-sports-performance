<form action="https://formsubmit.co/info@drdrewsportsperformance.com" method="POST">

  <!-- Security -->
  <input type="hidden" name="_subject" value="New Athlete Coaching Application">
  <input type="hidden" name="_captcha" value="true">
  <input type="hidden" name="_template" value="table">

  <!-- Honeypot Spam Protection -->
  <input type="text" name="_honey" style="display:none">

  <input
    type="text"
    name="Parent or Athlete Name"
    placeholder="Parent or athlete name"
    required
  />

  <input
    type="email"
    name="Email"
    placeholder="Email"
    required
  />

  <input
    type="text"
    name="Phone Number"
    placeholder="Phone Number"
    required
  />

  <input
    type="text"
    name="Athlete Age"
    placeholder="Athlete age"
    required
  />

  <select name="Sport" required>
    <option value="">Choose primary sport</option>
    <option>Youth Athlete Development</option>
    <option>Running</option>
    <option>Golf</option>
    <option>Lacrosse</option>
    <option>Field / Court Sport</option>
    <option>Return to Sport</option>
    <option>BMX Racing</option>
    <option>Other</option>
  </select>

  <select name="Plan Interest" required>
    <option value="">Plan interested in</option>
    <option>Digital Youth Plan - $29/month</option>
    <option>Youth Performance Coaching - $99/month</option>
    <option>Performance+ - $199/month</option>
    <option>Not sure yet</option>
  </select>

  <textarea
    name="Goals and History"
    placeholder="Tell me about the athlete’s goals, sport, current training, injury history, schedule, equipment access, and what you want help with."
    required
  ></textarea>

  <label style="display:flex; gap:10px; align-items:flex-start;">
    <input type="checkbox" required style="width:auto; margin-top:4px;">
    <span>
      I consent to being contacted by Dr. Drew Sports Performance regarding coaching services.
    </span>
  </label>

  <label style="display:flex; gap:10px; align-items:flex-start;">
    <input type="checkbox" required style="width:auto; margin-top:4px;">
    <span>
      If the athlete is under 18 years old, I confirm I am the parent or legal guardian.
    </span>
  </label>

  <button class="btn btn-primary" type="submit">
    Submit Application
  </button>

  <div class="form-note">
    Applications are securely submitted to
    info@drdrewsportsperformance.com
  </div>

</form>
